<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axsis Rhythm Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="mainMenu" class="screen" aria-labelledby="main-title">
      <h1 id="main-title">Axsis Rhythm Game</h1>
      <div class="menu-buttons" aria-label="メニュー">
        <button type="button" class="menu-btn">ゲームスタート</button>
        <button type="button" class="menu-btn">譜面エディター</button>
        <button type="button" class="menu-btn">設定</button>
      </div>
      <p style="margin-top: 2rem; color: white; text-align: center; line-height: 1.8; max-width: 32rem; padding: 0 1.5rem;">
        ブラウザで遊べるAxsisのリズムゲームへようこそ。<br>
        D / F / J / K の4レーンを使ったプレイを想定したトップページです。
      </p>
    </section>
  </main>
</body>
</html>
